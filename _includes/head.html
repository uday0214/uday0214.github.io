<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- assign meta_description = page.description | default: page.excerpt | default: site.description -%}
  {%- if page.title -%}
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  {%- else -%}
    <title>{{ site.title | escape }}</title>
  {%- endif -%}

  <meta name="description" content="{{ meta_description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fc">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07111f">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ meta_description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">

  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  {%- include head-custom.html -%}
</head>
